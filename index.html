<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>班級計分管理系統</title>
<style>
:root{--ink:#16243a;--muted:#64748b;--line:#e2e8f0;--panel:#fff;--bg:#f3f6fb;--blue:#315ee8;--blue-dark:#2449c6;--green:#12804b;--green-bg:#e9f8ef;--red:#c13c40;--red-bg:#fff0ef;--shadow:0 10px 30px rgba(28,48,83,.07);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8eb1ff;outline-offset:2px}.app{max-width:1440px;margin:auto;padding:24px clamp(14px,3vw,36px) 50px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:13px}.brand-icon{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#426df1,#765de7);display:grid;place-items:center;color:white;font-size:24px;box-shadow:0 8px 20px #4569dc44}.brand h1{font-size:clamp(21px,3vw,29px);margin:0;letter-spacing:.02em}.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}.save-state{color:#51715f;background:#edf8f0;padding:8px 12px;border-radius:999px;font-size:13px;white-space:nowrap}.panel{background:var(--panel);border:1px solid #e8edf4;border-radius:var(--radius);box-shadow:var(--shadow)}.class-panel{padding:18px 20px;margin-bottom:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.section-head h2,.toolbar h2{font-size:17px;margin:0}.class-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.class-select{height:46px;min-width:170px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:0 38px 0 13px;font-weight:700}.btn{border:0;border-radius:11px;min-height:44px;padding:10px 15px;font-weight:700;transition:transform .12s,filter .12s,background .12s}.btn:active{transform:scale(.97)}.btn-primary{background:var(--blue);color:white}.btn-primary:hover{background:var(--blue-dark)}.btn-light{background:#f1f4f9;color:#334155;border:1px solid #e5eaf1}.btn-light:hover{background:#e8edf5}.btn-danger{background:#fff1f0;color:#b83237;border:1px solid #ffd9d6}.btn-small{min-height:38px;padding:8px 12px;font-size:14px}.class-note{color:var(--muted);font-size:13px;margin:12px 0 0}.toolbar{padding:17px 20px;margin-bottom:16px}.toolbar-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.toolbar-actions{display:flex;gap:9px;flex-wrap:wrap}.tool-grid{display:grid;grid-template-columns:1.1fr 1.6fr 1.15fr;gap:12px}.tool-group{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfcfe}.tool-label{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}.tool-buttons{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tool-buttons .btn{flex:1}.zero-btn{width:100%}.sort-select{height:43px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 10px;color:var(--ink);font-weight:700;flex:1;min-width:150px}.draw-result{margin-top:12px;border-radius:14px;background:linear-gradient(100deg,#eef2ff,#f4f0ff);padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px}.draw-result strong{font-size:20px;color:#4138a8}.draw-result span{color:#5d5c8b;font-size:14px}.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 2px 12px}.list-head h2{font-size:19px;margin:0}.list-meta{font-size:14px;color:var(--muted)}.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,285px),1fr));gap:14px}.student-card{position:relative;background:white;border:1px solid #e8edf4;border-radius:17px;padding:17px;box-shadow:0 6px 18px rgba(31,49,78,.045);transition:border-color .2s,transform .2s}.student-card.flash-plus{border-color:#55c789;background:linear-gradient(0deg,#f1fcf5,#fff);animation:flash .75s ease}.student-card.flash-minus{border-color:#ef8585;background:linear-gradient(0deg,#fff5f4,#fff);animation:flash .75s ease}@keyframes flash{0%{transform:scale(1)}35%{transform:scale(1.018)}100%{transform:scale(1)}}.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.student-id{display:flex;align-items:center;gap:11px;min-width:0}.seat{width:45px;height:45px;border-radius:14px;background:#eef2ff;color:#3559c8;display:grid;place-items:center;font-weight:900;font-size:17px;flex:none}.student-name{font-weight:800;font-size:19px;overflow-wrap:anywhere}.rank{font-size:12px;color:#80611a;background:#fff5d9;padding:4px 8px;border-radius:99px;white-space:nowrap}.score-area{display:flex;align-items:baseline;gap:7px;margin:15px 0 13px;padding:11px 12px;background:#f7f9fc;border-radius:13px}.score-number{font-size:34px;line-height:1;font-weight:900;letter-spacing:-.04em}.score-caption{font-size:13px;color:var(--muted)}.score-positive{color:var(--green)}.score-negative{color:var(--red)}.quick-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.score-btn{min-height:47px;border:1px solid transparent;border-radius:12px;font-size:17px;font-weight:850}.score-btn.plus{background:var(--green-bg);color:var(--green);border-color:#d5f0df}.score-btn.minus{background:var(--red-bg);color:var(--red);border-color:#ffe0dd}.score-btn:hover{filter:brightness(.97)}.custom-row{display:flex;gap:8px;margin-top:10px}.custom-input{min-width:0;flex:1;height:43px;border:1px solid var(--line);border-radius:11px;padding:0 11px;font-weight:700}.apply-custom{height:43px;min-height:43px;white-space:nowrap}.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:11px;border-top:1px solid #f0f2f6}.drawn-badge{font-size:12px;color:#6b7280}.card-actions{display:flex;gap:6px}.icon-btn{border:0;background:transparent;color:#64748b;min-width:36px;min-height:34px;border-radius:8px;font-size:13px;font-weight:700}.icon-btn:hover{background:#f1f4f9;color:#26364d}.empty{background:white;border:1px dashed #cbd5e1;border-radius:18px;padding:48px 18px;text-align:center;color:var(--muted)}.empty .empty-icon{font-size:34px;margin-bottom:6px}.empty strong{display:block;color:#334155;font-size:18px;margin-bottom:4px}.footer{margin-top:22px;text-align:center;color:#8591a4;font-size:12px}.modal-backdrop{position:fixed;inset:0;background:#15223877;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal-backdrop.open{display:flex}.modal{background:white;border-radius:20px;padding:22px;width:min(100%,560px);max-height:min(90vh,820px);overflow:auto;box-shadow:0 24px 90px #12234444}.modal h2{margin:0 0 6px;font-size:21px}.modal p{margin:0 0 16px;color:var(--muted);font-size:14px}.modal label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink)}.modal textarea{min-height:190px;resize:vertical;font-family:inherit;line-height:1.6}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.help{font-size:12px!important;margin-top:7px!important}.hidden{display:none!important}
@media(max-width:800px){.tool-grid{grid-template-columns:1fr 1fr}.tool-group:last-child{grid-column:1/-1}}@media(max-width:560px){.app{padding:14px 12px 32px}.topbar{align-items:flex-start}.brand-icon{width:43px;height:43px}.save-state{font-size:11px;padding:7px 9px}.class-panel,.toolbar{padding:15px}.class-row{display:grid;grid-template-columns:1fr 1fr}.class-select{grid-column:1/-1;width:100%}.class-row .btn{width:100%;padding-inline:9px}.toolbar-top{align-items:flex-start;flex-direction:column}.toolbar-actions{width:100%}.toolbar-actions .btn{flex:1}.tool-grid{grid-template-columns:1fr}.tool-group:last-child{grid-column:auto}.list-head{align-items:flex-start;flex-direction:column;gap:3px}.student-grid{grid-template-columns:1fr}.student-card{padding:16px}.draw-result{align-items:flex-start;flex-direction:column}.section-head{align-items:flex-start}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-icon" aria-hidden="true">✦</div><div><h1>班級計分管理系統</h1><p>讓每一次鼓勵，都清楚記錄</p></div></div>
    <div class="save-state" id="saveState" aria-live="polite">● 資料已儲存</div>
  </header>

  <section class="panel class-panel" aria-labelledby="classTitle">
    <div class="section-head"><h2 id="classTitle">班級管理</h2><span class="list-meta" id="classCount"></span></div>
    <div class="class-row">
      <select class="class-select" id="classSelect" aria-label="選擇班級"></select>
      <button class="btn btn-primary" id="addClassBtn">＋ 新增班級</button>
      <button class="btn btn-light" id="renameClassBtn">重新命名</button>
      <button class="btn btn-danger" id="deleteClassBtn">刪除班級</button>
    </div>
    <p class="class-note">每個班級的名單、分數與抽籤紀錄皆分開儲存於此瀏覽器。</p>
  </section>

  <section class="panel toolbar" aria-label="全班操作、抽籤與排序">
    <div class="toolbar-top"><h2>全班工具</h2><div class="toolbar-actions"><button class="btn btn-light btn-small" id="addStudentBtn">＋ 新增學生</button><button class="btn btn-light btn-small" id="batchBtn">批次匯入名單</button></div></div>
    <div class="tool-grid">
      <div class="tool-group"><div class="tool-label">全班加減分</div><div class="tool-buttons"><button class="btn btn-primary" id="classPlusBtn">全班加分</button><button class="btn btn-danger" id="classMinusBtn">全班扣分</button></div></div>
      <div class="tool-group"><div class="tool-label">隨機抽人</div><div class="tool-buttons"><button class="btn btn-primary" id="drawBtn">開始抽籤</button><label style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;white-space:nowrap"><input id="skipDrawn" type="checkbox" checked style="width:17px;height:17px;accent-color:#315ee8">跳過今日已抽</label></div></div>
      <div class="tool-group"><div class="tool-label">名單與排序</div><div class="tool-buttons"><select id="sortSelect" class="sort-select" aria-label="選擇排序方式"><option value="seat">座號排序</option><option value="score">分數排行榜</option></select><button class="btn btn-danger" id="resetBtn">全班歸零</button></div></div>
    </div>
    <div class="draw-result" id="drawResult" aria-live="polite"><span>抽籤結果會顯示在這裡</span><span>每日自動重置抽籤紀錄</span></div>
  </section>

  <div class="list-head"><h2 id="listTitle">學生名單</h2><span class="list-meta" id="listMeta"></span></div>
  <main id="studentList" class="student-grid" aria-live="polite"></main>
  <div class="footer">資料保存在目前瀏覽器的 LocalStorage。請定期匯出 JSON 備份。</div>
</div>

<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal"><h2 id="modalTitle"></h2><p id="modalDescription"></p><div id="modalContent"></div><div class="modal-actions"><button class="btn btn-light" id="modalCancel">取消</button><button class="btn btn-primary" id="modalConfirm">確定</button></div></div>
</div>
<input type="file" id="restoreInput" accept="application/json,.json" class="hidden">
<script>
(()=>{
'use strict';
const STORAGE_KEY='classScoreManager_v1';
const today=()=>new Date().toLocaleDateString('en-CA');
const uid=()=>('s'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const defaultData=()=>({version:1,activeClassId:null,classes:[]});
let data=loadData();let sortMode='seat';let modalResolve=null;
function loadData(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return defaultData();const x=JSON.parse(raw);if(!x||!Array.isArray(x.classes))return defaultData();x.classes.forEach(c=>{if(!Array.isArray(c.students))c.students=[];c.students.forEach(s=>{if(typeof s.score!=='number')s.score=0;if(!s.id)s.id=uid();if(!s.drawnDate)s.drawnDate='';});});return x}catch(e){console.warn('載入資料失敗',e);return defaultData()}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));const el=$('saveState');el.textContent='● 資料已儲存';el.style.color='';}catch(e){$('saveState').textContent='⚠ 儲存失敗，空間可能不足';$('saveState').style.color='#b83237';}}
const $=id=>document.getElementById(id);
const activeClass=()=>data.classes.find(c=>c.id===data.activeClassId)||null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(data.classes.length&&!activeClass())data.activeClassId=data.classes[0].id;const sel=$('classSelect');sel.innerHTML=data.classes.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');if(activeClass())sel.value=activeClass().id;$('classCount').textContent=`共 ${data.classes.length} 個班級`;$('listTitle').textContent=activeClass()?`${activeClass().name}｜學生名單`:'學生名單';$('addStudentBtn').disabled=!activeClass();$('batchBtn').disabled=!activeClass();$('renameClassBtn').disabled=!activeClass();$('deleteClassBtn').disabled=!activeClass();$('classPlusBtn').disabled=!activeClass()||!activeClass().students.length;$('classMinusBtn').disabled=!activeClass()||!activeClass().students.length;$('resetBtn').disabled=!activeClass()||!activeClass().students.length;$('drawBtn').disabled=!activeClass()||!activeClass().students.length;
 const list=$('studentList');const c=activeClass();if(!c){$('listMeta').textContent='請先新增班級以建立名單';list.className='';list.innerHTML='<div class="empty"><div class="empty-icon">🏫</div><strong>還沒有班級</strong>新增一個班級，開始建立學生名單。</div>';return}
 let students=[...c.students];students.sort(sortMode==='score'?(a,b)=>b.score-a.score||seatCompare(a,b):seatCompare);$('listMeta').textContent=`${c.students.length} 位學生 · ${sortMode==='score'?'排行榜模式':'座號排序'}`;if(!students.length){list.className='';list.innerHTML='<div class="empty"><div class="empty-icon">📝</div><strong>名單目前是空的</strong>可以單筆新增學生，或使用「批次匯入名單」快速建立。</div>';return}list.className='student-grid';list.innerHTML=students.map((s,i)=>{const rank=sortMode==='score'?`<span class="rank">第 ${i+1} 名</span>`:'';const drawn=s.drawnDate===today();return `<article class="student-card" id="card-${esc(s.id)}"><div class="card-top"><div class="student-id"><div class="seat">${esc(s.seat)}</div><div class="student-name">${esc(s.name)}</div></div>${rank}</div><div class="score-area"><span class="score-number ${s.score>0?'score-positive':s.score<0?'score-negative':''}">${s.score>0?'+':''}${s.score}</span><span class="score-caption">目前總分</span></div><div class="quick-buttons"><button class="score-btn plus" data-delta="1" data-id="${esc(s.id)}">＋1</button><button class="score-btn plus" data-delta="5" data-id="${esc(s.id)}">＋5</button><button class="score-btn minus" data-delta="-1" data-id="${esc(s.id)}">−1</button><button class="score-btn minus" data-delta="-5" data-id="${esc(s.id)}">−5</button></div><form class="custom-row" data-form="${esc(s.id)}"><input class="custom-input" name="amount" type="number" step="any" inputmode="decimal" placeholder="自訂分數（正數加、負數扣）" aria-label="${esc(s.name)}自訂加減分"><button class="btn btn-light apply-custom" type="submit">套用</button></form><div class="card-bottom"><span class="drawn-badge">${drawn?'✓ 今日已抽過':'未抽過'}</span><div class="card-actions"><button class="icon-btn" data-action="edit" data-id="${esc(s.id)}">編輯</button><button class="icon-btn" data-action="delete" data-id="${esc(s.id)}">刪除</button></div></div></article>`}).join('');}
function seatCompare(a,b){const an=Number(a.seat),bn=Number(b.seat);if(Number.isFinite(an)&&Number.isFinite(bn)&&an!==bn)return an-bn;return String(a.seat).localeCompare(String(b.seat),'zh-Hant',{numeric:true})||a.name.localeCompare(b.name,'zh-Hant')}
function showModal({title,description='',fields,confirmText='確定'}){return new Promise(resolve=>{modalResolve=resolve;$('modalTitle').textContent=title;$('modalDescription').textContent=description;$('modalConfirm').textContent=confirmText;$('modalContent').innerHTML=fields;$('modalBackdrop').classList.add('open');const input=$('modalContent').querySelector('input,textarea');if(input)setTimeout(()=>input.focus(),50)})}
function closeModal(value){$('modalBackdrop').classList.remove('open');if(modalResolve){modalResolve(value);modalResolve=null}}
$('modalCancel').onclick=()=>closeModal(null);$('modalConfirm').onclick=()=>{const form=$('modalContent').querySelector('form');if(form){if(!form.reportValidity())return;closeModal(Object.fromEntries(new FormData(form).entries()))}else closeModal(true)};$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal(null)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalBackdrop').classList.contains('open'))closeModal(null)});
async function addClass(){const r=await showModal({title:'新增班級',description:'例如：701班、702班',fields:'<form><label for="classNameInput">班級名稱</label><input id="classNameInput" name="name" required maxlength="40" placeholder="輸入班級名稱"></form>'});if(!r)return;const name=r.name.trim();if(!name)return;if(data.classes.some(c=>c.name.toLowerCase()===name.toLowerCase())){alert('已有相同名稱的班級。');return}const c={id:uid(),name,students:[]};data.classes.push(c);data.activeClassId=c.id;save();render()}
$('addClassBtn').onclick=addClass;$('classSelect').onchange=e=>{data.activeClassId=e.target.value;save();render();$('drawResult').innerHTML='<span>抽籤結果會顯示在這裡</span><span>每日自動重置抽籤紀錄</span>'};
$('renameClassBtn').onclick=async()=>{const c=activeClass();if(!c)return;const r=await showModal({title:'重新命名班級',fields:`<form><label for="renameInput">班級名稱</label><input id="renameInput" name="name" required maxlength="40" value="${esc(c.name)}"></form>`});if(!r)return;const name=r.name.trim();if(!name)return;if(data.classes.some(x=>x.id!==c.id&&x.name.toLowerCase()===name.toLowerCase()))return alert('已有相同名稱的班級。');c.name=name;save();render()};
$('deleteClassBtn').onclick=()=>{const c=activeClass();if(!c)return;if(!confirm(`確定刪除「${c.name}」及其中 ${c.students.length} 位學生的所有資料？此操作無法復原。`))return;data.classes=data.classes.filter(x=>x.id!==c.id);data.activeClassId=data.classes[0]?.id||null;save();render()};
async function studentForm(existing){const isEdit=!!existing;const r=await showModal({title:isEdit?'編輯學生':'新增學生',description:isEdit?'更新座號與姓名。':'請輸入學生座號與姓名。',fields:`<form><label for="seatInput">座號</label><input id="seatInput" name="seat" required maxlength="20" value="${esc(existing?.seat||'')}" placeholder="例如：1"><label for="nameInput">姓名</label><input id="nameInput" name="name" required maxlength="60" value="${esc(existing?.name||'')}" placeholder="學生姓名"></form>`});if(!r)return;const c=activeClass();if(!c)return;const seat=r.seat.trim(),name=r.name.trim();if(!seat||!name)return;const duplicate=c.students.find(s=>s.seat===seat&&s.id!==existing?.id);if(duplicate&&!confirm(`座號 ${seat} 已有「${duplicate.name}」，仍要繼續嗎？`))return;if(existing){existing.seat=seat;existing.name=name}else c.students.push({id:uid(),seat,name,score:0,drawnDate:''});save();render()}
$('addStudentBtn').onclick=()=>studentForm(null);$('studentList').addEventListener('click',e=>{const quick=e.target.closest('[data-delta]');if(quick){changeScore(quick.dataset.id,Number(quick.dataset.delta));return}const action=e.target.closest('[data-action]');if(!action)return;const c=activeClass(),s=c?.students.find(x=>x.id===action.dataset.id);if(!s)return;if(action.dataset.action==='edit')studentForm(s);else if(confirm(`確定刪除「${s.seat}號 ${s.name}」？`)){c.students=c.students.filter(x=>x.id!==s.id);save();render()}});
$('studentList').addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const amount=Number(new FormData(form).get('amount'));if(!Number.isFinite(amount)||amount===0)return alert('請輸入不為 0 的有效分數。');changeScore(form.dataset.form,amount);});
function changeScore(id,delta){const s=activeClass()?.students.find(x=>x.id===id);if(!s||!Number.isFinite(delta))return;s.score=Math.round((s.score+delta)*100)/100;save();render();const card=$('card-'+CSS.escape(id));if(card){card.classList.add(delta>0?'flash-plus':'flash-minus');setTimeout(()=>card.classList.remove('flash-plus','flash-minus'),800)}}
async function batchImport(){const r=await showModal({title:'批次匯入學生名單',description:'一行一位學生，支援「座號 姓名」、「座號,姓名」或「座號、姓名」。也可只貼姓名，系統會依序編號。',fields:'<form><label for="batchText">貼上名單</label><textarea id="batchText" name="text" required placeholder="1 王小明\n2 李小華\n3,陳大文"></textarea><p class="help">匯入時若座號重複，會略過該筆；已存在的名單不會被覆蓋。</p></form>',confirmText:'匯入名單'});if(!r)return;const c=activeClass();if(!c)return;const lines=r.text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let added=0,skipped=0;for(const line of lines){let seat,name;const parts=line.split(/\s*[,，、;；\t]\s*|\s+/).filter(Boolean);if(parts.length>1){seat=parts.shift().replace(/^座號[:：]?/,'');name=parts.join(' ').trim()}else{name=parts[0].trim();seat=String(nextSeat(c.students))}if(!seat||!name){skipped++;continue}if(c.students.some(s=>s.seat===seat)){skipped++;continue}c.students.push({id:uid(),seat,name,score:0,drawnDate:''});added++}save();render();alert(`匯入完成：新增 ${added} 位${skipped?`，略過 ${skipped} 筆（空白或座號重複）`:''}。`)}
function nextSeat(students){const nums=students.map(s=>Number(s.seat)).filter(Number.isFinite);return (nums.length?Math.max(...nums):0)+1}
$('batchBtn').onclick=batchImport;
async function classDelta(sign){const c=activeClass();if(!c?.students.length)return;const r=await showModal({title:sign>0?'全班加分':'全班扣分',description:`將對「${c.name}」全班 ${c.students.length} 位學生${sign>0?'加上':'扣除'}相同分數。`,fields:`<form><label for="classAmount">${sign>0?'加':'扣'}幾分？</label><input id="classAmount" name="amount" type="number" min="0.01" step="any" required value="1"></form>`,confirmText:'套用全班'});if(!r)return;const n=Number(r.amount);if(!Number.isFinite(n)||n<=0)return;for(const s of c.students)s.score=Math.round((s.score+sign*n)*100)/100;save();render()}
$('classPlusBtn').onclick=()=>classDelta(1);$('classMinusBtn').onclick=()=>classDelta(-1);$('resetBtn').onclick=()=>{const c=activeClass();if(!c)return;if(!confirm(`確定將「${c.name}」全班 ${c.students.length} 位學生的分數歸零？`))return;c.students.forEach(s=>s.score=0);save();render()};
$('sortSelect').onchange=e=>{sortMode=e.target.value;render()};
$('drawBtn').onclick=()=>{const c=activeClass();if(!c?.students.length)return;const pool=$('skipDrawn').checked?c.students.filter(s=>s.drawnDate!==today()):c.students.slice();if(!pool.length){$('drawResult').innerHTML='<strong>今天每位學生都已抽過囉！</strong><span>取消「跳過今日已抽」即可重新抽籤</span>';return}const winner=pool[Math.floor(Math.random()*pool.length)];winner.drawnDate=today();save();render();$('drawResult').innerHTML=`<strong>🎉 ${esc(winner.seat)}號　${esc(winner.name)}</strong><span>${esc(c.name)} · 今日抽籤完成</span>`;const card=$('card-'+CSS.escape(winner.id));if(card)card.scrollIntoView({behavior:'smooth',block:'center'})};
function download(name,content,type){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const exportBar=document.createElement('div');exportBar.className='panel';exportBar.style.cssText='padding:14px 18px;margin-top:16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap';exportBar.innerHTML='<strong style="margin-right:auto">資料匯出與備份</strong><button class="btn btn-light btn-small" id="csvBtn">匯出 CSV（Excel）</button><button class="btn btn-light btn-small" id="backupBtn">下載 JSON 備份</button><button class="btn btn-light btn-small" id="restoreBtn">還原 JSON 備份</button>';$('studentList').after(exportBar);
$('csvBtn').onclick=()=>{const c=activeClass();if(!c)return alert('請先選擇班級。');const rows=[['班級','座號','姓名','總分','今日已抽過'],...c.students.slice().sort(seatCompare).map(s=>[c.name,s.seat,s.name,s.score,s.drawnDate===today()?'是':'否'])];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download(`${c.name}_學生分數_${today()}.csv`,csv,'text/csv;charset=utf-8')};
$('backupBtn').onclick=()=>download(`班級計分備份_${today()}.json`,JSON.stringify(data,null,2),'application/json;charset=utf-8');$('restoreBtn').onclick=()=>$('restoreInput').click();$('restoreInput').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!parsed||!Array.isArray(parsed.classes)||!parsed.classes.every(c=>c&&typeof c.name==='string'&&Array.isArray(c.students)))throw new Error('格式不符');if(!confirm(`備份包含 ${parsed.classes.length} 個班級。還原將取代目前所有班級與學生資料，確定繼續？`))return;data={version:1,activeClassId:parsed.activeClassId||parsed.classes[0]?.id||null,classes:parsed.classes.map(c=>({id:c.id||uid(),name:c.name,students:c.students.map(s=>({id:s.id||uid(),seat:String(s.seat??''),name:String(s.name??''),score:Number(s.score)||0,drawnDate:s.drawnDate||''}))}))};save();render();alert('資料還原完成。')}catch(err){alert('無法還原：檔案不是有效的班級計分 JSON 備份。')}finally{e.target.value=''}};
if(!data.classes.length){const c={id:uid(),name:'701班',students:[]};data.classes.push(c);data.activeClassId=c.id;save()}render();
})();
</script>
